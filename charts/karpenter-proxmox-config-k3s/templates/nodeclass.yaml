{{- range $name, $class := .Values.nodeClass }}
{{- if $class.enabled }}
---
apiVersion: karpenter.proxmox.sinextra.dev/v1alpha1
kind: ProxmoxNodeClass
metadata:
  name: {{ $name }}
  labels:
    {{- include "karpenter-proxmox-config-k3s.labels" $ | nindent 4 }}
spec:
  {{- $class.spec | toYaml | nindent 2 }}
{{- end }}
{{- end }}
