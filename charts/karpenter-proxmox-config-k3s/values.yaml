# Default values for karpenter-proxmox-config-k3s.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This chart generates configuration required by karpenter-Provider-Proxmox to scale a Kubernetes cluster.
# It creates the following Secrets:
#   - Cloud-Init template: contains cloud config sections with placeholder/variables, referenced in ProxmoxNodeClass.Spec.metadataOptions.templatesRef
#   - Cloud-Init values: values injected in the cloud-init template for rendering of a valid cloud-init configuration, referenced in ProxmoxNodeClass.Spec.metadataOptions.valuesRef
#
# Note: This chart is created for K3s on Ubuntu24 but may work with other Debian-based distributions.

## Two installation options for K3s agent (worker) are supported:
##
## 1 - installation executed through Cloud-Init (installK3sAgent: true)
##     In this mode, the VM template does not come with K3s pre-installed.
##     K3s installation is included in the Cloud-Init user-data configuration generated by this chart.
##
## 2 - installation executed by the VM template as first boot script (installK3sAgent: false)
##     In this mode, the K3s agent is installed ahead of time with dummy values, which are later overridden by the K3s config file generated by Cloud-Init.
##     The K3s service must be disabled and stopped in the template. It will be started and enabled by Cloud-Init once the real configuration has been written.
##     Example: --firstboot-command "curl -sfL https://get.k3s.io | K3S_URL=https://dummy:6443 K3S_TOKEN=dummy INSTALL_K3S_SKIP_START=true INSTALL_K3S_SKIP_ENABLE=true INSTALL_K3S_VERSION=$K3S_VERSION sh -"
cloudInitTemplate:
  # -- Name of the Secret containing the Cloud-Init template. This name is required in ProxmoxNodeClass.Spec.metadataOptions.templatesRef
  name: karpenter-k3s-cloudinit-template

  # -- Include or exclude the K3s agent installation step from the Cloud-Init script.
  # -- Set this to 'false' if your Node VM template already handles the K3s agent installation (see option 2 above).
  installK3sAgent: false

  # -- (Optional) If cloudInitTemplate.installK3sAgent is 'true', specify the K3s version to install.
  # -- Leave empty to install the latest stable release.
  k3sVersion: "v1.35.2+k3s1"
  
  # -- Ensure a new Machine ID is generated on first boot, to avoid DHCP IP collisions between clones sharing the same Machine ID.
  # -- This is required unless the Machine ID has already been reset in the VM template itself (e.g. using virt-customize --truncate /etc/machine-id).
  resetMachineId: true


cloudInitValues:
  # -- Name of the Secret containing the Cloud-Init values. This name is required in ProxmoxNodeClass.Spec.metadataOptions.valuesRef
  name: karpenter-k3s-cloudinit-values

  # -- URL of the existing K3s server to join.
  k3sServerURL: "https://master.example.local:6443"

  # -- K3s server token, used to authenticate worker nodes joining the cluster.
  k3sToken: ""

  # -- Username to create on the worker node's operating system.
  sshUser: karpntr

  # -- (Optional) SSH public key to enable key-based login for sshUser.
  sshKey: ""

  # -- (Optional) Hashed password to enable password-based login for sshUser.
  # -- Generate with: openssl passwd -6 "user_password"
  sshPasswordHash: ""


nodeTemplate:
  # -- Name of your VM Template
  k3s-template:

    # -- Create the VM Template Karpenter resource
    enabled: true
    
    # -- ProxmoxTemplate or ProxmoxUnmanagedTemplate
    kind: ProxmoxUnmanagedTemplate
    
    # -- Raw spec of Proxmox Node VM Template https://github.com/sergelogvinov/karpenter-provider-proxmox/blob/main/docs/nodetemplateclass.md
    spec:
      templateName: k3-ubuntu-karpenter
    
    # -- (Optional) Tags to find the Proxmox template. If specified, all listed tags must be present on the template.
    # tags:
    #   - ubuntu24


nodeClass:
  # -- Name of your Node Class
  k3s-worker:

    # -- Create the Proxmox Node Class
    enabled: true
    
    # -- Raw spec for ProxmoxNodeClass. Ref: https://github.com/sergelogvinov/karpenter-provider-proxmox/blob/main/docs/nodeclass.md
    spec:
      # The Proxmox virtual machine template reference (required)
      instanceTemplateRef:
        kind: ProxmoxUnmanagedTemplate
        name: k3s-template
      
      # Root device for the VM
      bootDevice:
        size: 50Gi
        storage: vmdata

      metadataOptions:
        type: cdrom
        templatesRef:
          name: karpenter-k3s-cloudinit-template
          namespace: kube-system
        valuesRef:
          name: karpenter-k3s-cloudinit-values
          namespace: kube-system
    
      # securityGroups:
      #   - name: kubernetes
      #     interface: net0
      
      # -- (Optional) Tags to apply to the VM in the Proxmox dashboard
      tags:
        - karpenter
        - k3s
        - ubuntu24


nodePools:
  # -- Name of your Node Pool
  k3s-pool:

    # -- Create the Karpenter Node Pool
    enabled: true
  
    # -- Raw spec of Node Pool. Ref: https://karpenter.sh/docs/concepts/nodepools
    spec:
      limits:
        cpu: "48"
        memory: 96Gi
      template:
        spec:
          nodeClassRef:
            group: karpenter.proxmox.sinextra.dev
            kind: ProxmoxNodeClass
            name: k3s-worker
          requirements:
            - key: "kubernetes.io/arch"
              operator: In
              values: ["amd64"]
